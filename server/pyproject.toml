[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lanot-server"
version = "0.1.0"
description = "LANOT server: ingest API, rules, incidents, investigator and dashboard"
license = "MIT"
# lanot-common is a local path package: pip install -e common -e server
requires-python = ">=3.12"
dependencies = [
    "lanot-common",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "jinja2>=3.1",
    "fritzconnection>=1.13",
    "anthropic>=0.30",
    "pydantic-settings>=2.7",
    "icmplib>=3.0",
    "dnspython>=2.4",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["lanot", "lanot.*"]

[tool.setuptools.package-data]
"lanot.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
