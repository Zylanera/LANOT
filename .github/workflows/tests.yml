name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -e common -e "agent[test]" -e "server[test]"
      - name: common
        run: pytest common/tests -q -p no:cacheprovider
      - name: agent
        run: pytest agent/tests -q -p no:cacheprovider
      - name: server
        run: pytest server/tests -q -p no:cacheprovider
      - name: hostcheck
        run: pytest hostcheck/tests -q -p no:cacheprovider
      - name: shell syntax
        run: for f in hostcheck/lanot-ro deploy/*.sh deploy/*/*.sh; do bash -n "$f"; done
